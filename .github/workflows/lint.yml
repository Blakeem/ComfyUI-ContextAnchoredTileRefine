name: Lint

on: [push, pull_request]

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: ruff 0.16.0 changed the default rule set, and the config's explicit
      # select list is only reproducible against a fixed version.
      - name: Install Ruff
        run: pip install ruff==0.16.2
      - name: Run Ruff
        run: ruff check .
